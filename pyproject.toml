[project]
name = "ha-deepgram-tts"
version = "0.1.0"
description = "Deepgram Flux text to speech for Home Assistant"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]
# ruff formats python blocks inside markdown; HANDOFF.md is prose and stays as written.
# docs/review/repro holds throwaway reproduction scripts kept as review evidence. They are run
# by hand, never imported, and are deliberately left as they were when they produced their
# output, so linting them would mean editing evidence.
extend-exclude = ["*.md", ".venv", "docs/review"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ASYNC",
  "B",    # bugbear
  "C4",
  "D",    # docstrings
  "E",
  "F",
  "I",    # import sorting
  "N",
  "PGH",  # blanket noqa and type ignore
  "PTH",
  "RUF",
  "SIM",
  "T20",  # no print in the integration
  "TRY",  # exception handling antipatterns
  "UP",
  "W",
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "TRY003", # our typed errors carry the message on purpose
]

[tool.ruff.lint.per-file-ignores]
# Test doubles do not need docstrings, and a fake socket mirrors aiohttp's own
# timeout keyword, which ASYNC109 objects to.
"tests/*" = ["ASYNC109", "D100", "D101", "D102", "D103", "D105", "D107", "D401", "S101"]
# Measurement and deploy scripts print by design and are run by a human, not imported.
"scripts/*" = ["T20", "D100", "D103", "BLE001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
