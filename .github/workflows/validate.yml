name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # manifest_check.py parses the integration with ast, and this code targets 3.14. ruff's
      # own formatter emits `except A, B:` (PEP 758), which is a SyntaxError on anything older,
      # so the runner's system python would crash the guard rather than run it.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uvx ruff@0.16.7 check .
      - run: uvx ruff@0.16.7 format --check .
      - run: python scripts/manifest_check.py
      # Distribution rather than correctness: whether HACS and Home Assistant would
      # accept the repository at all. Both real gates are Docker actions, so this covers
      # the checks whose failure would otherwise only surface after a push.
      - run: python scripts/hacs_check.py

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: pytest -q
